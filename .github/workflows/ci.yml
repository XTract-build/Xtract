name: CI

on: [push, pull_request]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install xtract
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: CLI smoke test
        run: |
          python -m xtract.cli test_cases/solidity/SimpleStorage.sol /tmp/test_output.rs
          test -f /tmp/test_output.rs
          grep "SimpleStorage" /tmp/test_output.rs

  sdk:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xtract
        run: pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci
      - name: Build SDK
        working-directory: sdk
        run: npm run build
      - name: Run SDK tests
        working-directory: sdk
        run: npm test
