[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtract"
version = "1.0.0"
description = "Solidity to MultiversX Rust smart contract transpiler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "XTract Contributors" }
]
keywords = [
  "solidity",
  "rust",
  "multiversx",
  "elrond",
  "transpiler",
  "smart-contracts",
  "blockchain",
  "web3",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/XTract-build/Xtract"
Documentation = "https://github.com/XTract-build/Xtract/tree/main/docs"
Repository = "https://github.com/XTract-build/Xtract.git"
Issues = "https://github.com/XTract-build/Xtract/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
deploy = [
  "multiversx-sdk>=2.0.0",
]

[project.scripts]
xtract = "xtract.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["xtract*"]


